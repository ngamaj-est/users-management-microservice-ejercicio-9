$kind: http-request
name: Login
description: ""
order: 1000
method: POST
url: "{{base_url}}/api/auth/login"
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "email": "admin@example.com",
      "password": "Admin1234!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login successful - status 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has token", function () {
        const json = pm.response.json();
        const token = json.accessToken || json.token;
        pm.expect(token).to.be.a("string").and.not.empty;
      });

      pm.test("Token type is Bearer", function () {
        const json = pm.response.json();
        pm.expect(json.tokenType).to.eql("Bearer");
      });

      // Save token to environment for all subsequent requests
      const json = pm.response.json();
      const token = json.accessToken || json.token;
      if (token) {
        pm.environment.set("token", token);
        console.log("Token saved to environment.");
      }
    language: text/javascript

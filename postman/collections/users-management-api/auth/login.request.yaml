$kind: http-request
name: Login
description: ""
order: 1000
method: POST
url: "{{base_url}}/api/auth/login"
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "email": "admin@mail.com",
      "password": "$2y$10$C0MqFsCUQ4UZJgz.fl56KOylFnDrCaCclQp7k.pHQrnvwE/sahf0e"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login successful - status 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has token", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("token");
        pm.expect(json.token).to.be.a("string").and.not.empty;
      });

      pm.test("Token type is Bearer", function () {
        const json = pm.response.json();
        pm.expect(json.tokenType).to.eql("Bearer");
      });

      // Save token to environment for all subsequent requests
      const json = pm.response.json();
      if (json.token) {
        pm.environment.set("token", json.token);
        console.log("Token saved to environment.");
      }
    language: text/javascript

$kind: http-request
name: Update User
order: 4000
method: PUT
url: '{{base_url}}/api/users/{{user_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Nathan Gama Updated",
      "email": "nathan.updated@example.com",
      "password": "newpassword123",
      "role": "ADMIN",
      "status": "ACTIVE"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Update user - status 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has updated name", function () {
        const json = pm.response.json();
        pm.expect(json.name).to.eql("Nathan Gama Updated");
      });

      pm.test("Response has updated email", function () {
        const json = pm.response.json();
        pm.expect(json.email).to.eql("nathan.updated@example.com");
      });

      pm.test("Response id is unchanged", function () {
        const json = pm.response.json();
        pm.expect(json.id).to.eql(pm.environment.get("user_id"));
      });

$kind: http-request
name: Get User by ID
order: 3000
method: GET
url: '{{base_url}}/api/users/{{user_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Get user by ID - status 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has correct id", function () {
        const json = pm.response.json();
        pm.expect(json.id).to.eql(pm.environment.get("user_id"));
      });

      pm.test("Response has name field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("name");
      });

      pm.test("Response has email field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("email");
      });

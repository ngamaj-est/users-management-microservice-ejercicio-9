$kind: http-request
name: Update Enfermedad
order: 4000
method: PUT
url: '{{base_url}}/api/enfermedades/{{enfermedad_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Gripe Actualizada",
      "nombreCientifico": "Influenza tipo A",
      "nivelGravedad": "MODERADO",
      "sintomas": "Fiebre alta, tos seca, dolor muscular, fatiga",
      "medicamentos": "Oseltamivir, Paracetamol",
      "esContagiosa": true,
      "esCubiertaPorPos": true,
      "requiereIncapacidad": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Update enfermedad - status 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has updated nombre", function () {
        const json = pm.response.json();
        pm.expect(json.nombre).to.eql("Gripe Actualizada");
      });

      pm.test("Response has updated nivelGravedad", function () {
        const json = pm.response.json();
        pm.expect(json.nivelGravedad).to.eql("MODERADO");
      });

      pm.test("requiereIncapacidad is now true", function () {
        const json = pm.response.json();
        pm.expect(json.requiereIncapacidad).to.be.true;
      });

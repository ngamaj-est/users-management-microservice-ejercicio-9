$kind: http-request
name: Get Enfermedad by ID
order: 3000
method: GET
url: '{{base_url}}/api/enfermedades/{{enfermedad_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Get enfermedad by ID - status 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has correct id", function () {
        const json = pm.response.json();
        pm.expect(String(json.id)).to.eql(String(pm.environment.get("enfermedad_id")));
      });

      pm.test("Response has nombre field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("nombre");
      });

      pm.test("Response has nivelGravedad field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("nivelGravedad");
      });

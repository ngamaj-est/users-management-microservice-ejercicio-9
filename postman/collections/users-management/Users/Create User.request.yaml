$kind: http-request
url: "{{base_url}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{$guid}}",
      "name": "Juan Pérez",
      "email": "juan.perez@example.com",
      "password": "Password1!",
      "role": "MEMBER"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 201 && json.id) {
          pm.environment.set("user_id", json.id);
          console.log("user_id saved: " + json.id);
      }
    language: text/javascript
order: 1000

$kind: http-request
name: 'Create User'
method: POST
url: '{{base_url}}/api/users'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": "{{$guid}}",
      "name": "Juan Pérez",
      "email": "juan.perez@example.com",
      "password": "Password1!",
      "role": "MEMBER"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 201 && json.id) {
          pm.environment.set("user_id", json.id);
          console.log("user_id saved: " + json.id);
      }

$kind: http-request
url: "{{base_url}}/api/enfermedades"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Asma",
      "nombreCientifico": "Asthma bronchiale",
      "nivelGravedad": "Moderada",
      "sintomas": "Dificultad para respirar, sibilancias, opresión en el pecho, tos",
      "medicamentos": "Salbutamol, Budesonida",
      "esContagiosa": false,
      "esCubiertaPorPos": true,
      "requiereIncapacidad": false
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 201 && json.id) {
          pm.environment.set("enfermedad_id", json.id);
          console.log("enfermedad_id saved: " + json.id);
      }
    language: text/javascript
order: 1000
